(()=>{'use strict';const N=64,TW=64,TH=32,c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr,scale=1,ox=0,oy=0,tool='pan',dragging=false,moved=false,last=null,pinch=null,tick=0;let map=[],trees=[],roads=[],buildings=[],carriers=[],stock={log:0,plank:12},message='';const $=id=>document.getElementById(id);const rand=(x,y)=>{let n=Math.sin(x*127.1+y*311.7+57.4)*43758.5453;return n-Math.floor(n)};const index=(x,y)=>y*N+x;const valid=(x,y)=>x>=0&&y>=0&&x<N&&y<N;const key=(x,y)=>x+','+y;const centers=b=>({x:b.x,y:b.y});
function fresh(){map=[];trees=[];roads=[];buildings=[];carriers=[];stock={log:0,plank:12};for(let y=0;y<N;y++)for(let x=0;x<N;x++){const d=Math.hypot(x-32,y-32),r=rand(x,y);let type=d<8?0:r<.065?2:r<.14?3:0;map.push(type);trees.push(type===0&&d>7&&rand(x+31,y+17)<.38?3:0);roads.push(false)}buildings.push({id:1,type:'hq',x:32,y:32,prog:0,amount:0});for(let x=32;x<=37;x++)roads[index(x,33)]=true;for(let i=0;i<5;i++)carriers.push({x:32,y:33,tx:32,ty:33,path:[],cargo:null,phase:0});tick=0;nextWarnAt=0;scale=Math.min(W/780,1.25);ox=W*.50;oy=H*.37-32*TH*scale;updateMsg('나무꾼 집을 지어 생산을 시작하세요.');updateStats()}
function resize(){const oldW=W||innerWidth,oldH=H||innerHeight;dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!oldW){ox=W/2;oy=H/3}else{ox+=(W-oldW)/2;oy+=(H-oldH)/2}}function world(x,y){return {x:ox+(x-y)*TW/2*scale,y:oy+(x+y)*TH/2*scale}}function tile(px,py){let a=(px-ox)/scale/(TW/2),b=(py-oy)/scale/(TH/2);return {x:Math.floor((a+b)/2+.5),y:Math.floor((b-a)/2+.5)}}function diamond(x,y,fill,edge){const p=world(x,y),a=TW*scale/2,b=TH*scale/2;ctx.beginPath();ctx.moveTo(p.x,p.y-b);ctx.lineTo(p.x+a,p.y);ctx.lineTo(p.x,p.y+b);ctx.lineTo(p.x-a,p.y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(edge){ctx.strokeStyle=edge;ctx.lineWidth=1;ctx.stroke()}}function isoLine(x,y,x2,y2,color,width){let a=world(x,y),b=world(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width*scale;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#182f2c';ctx.fillRect(0,0,W,H);const v=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let p=world(x,y);if(p.x<-100||p.x>W+100||p.y<-100||p.y>H+100)continue;let type=map[index(x,y)],rnd=rand(x,y);diamond(x,y,type===2?'#397c9b':type===3?'#75867c':rnd<.3?'#56864c':rnd<.7?'#619354':'#6a9d58','#3d6d40');if(type===2){ctx.fillStyle='#88c0c5';ctx.fillRect(p.x-8*scale,p.y-2*scale,12*scale,2*scale)}if(type===3){ctx.fillStyle='#9da39a';ctx.beginPath();ctx.moveTo(p.x-9*scale,p.y);ctx.lineTo(p.x,p.y-16*scale);ctx.lineTo(p.x+10*scale,p.y+2*scale);ctx.fill()}if(roads[index(x,y)]){ctx.fillStyle='#ba9b69';ctx.beginPath();ctx.ellipse(p.x,p.y,TW*.27*scale,TH*.32*scale,0,0,Math.PI*2);ctx.fill()}if(trees[index(x,y)]>0)v.push({order:x+y+.2,render:()=>{let s=scale;ctx.fillStyle='#613e26';ctx.fillRect(p.x-3*s,p.y-18*s,6*s,19*s);ctx.fillStyle='#1b5038';ctx.beginPath();ctx.moveTo(p.x,p.y-53*s);ctx.lineTo(p.x-18*s,p.y-15*s);ctx.lineTo(p.x+18*s,p.y-15*s);ctx.fill();ctx.fillStyle='#39784b';ctx.beginPath();ctx.moveTo(p.x,p.y-55*s);ctx.lineTo(p.x-14*s,p.y-25*s);ctx.lineTo(p.x+10*s,p.y-25*s);ctx.fill()}});for(let b of buildings){if(b.x===x&&b.y===y)v.push({order:x+y+.5,render:()=>buildingArt(b)})}}
for(let w of carriers){let p=world(w.x,w.y);if(p.x<0||p.x>W||p.y<0||p.y>H)continue;v.push({order:w.x+w.y+.8,render:()=>{let s=scale;ctx.fillStyle='#3e2d22';ctx.fillRect(p.x-3*s,p.y-9*s,6*s,9*s);ctx.fillStyle=w.cargo?'#e9bc5b':w.target?'#90c6e3':'#d6d5b8';ctx.fillRect(p.x-5*s,p.y-17*s,10*s,10*s);ctx.fillStyle='#efc59d';ctx.fillRect(p.x-4*s,p.y-23*s,8*s,7*s);if(w.cargo){ctx.fillStyle=w.cargo==='log'?'#8e5729':'#d7b680';ctx.fillRect(p.x+5*s,p.y-18*s,9*s,7*s)}}});}v.sort((a,b)=>a.order-b.order);for(let a of v)a.render();requestAnimationFrame(draw)}function buildingArt(b){let p=world(b.x,b.y),s=scale;if(b.status==='construction'){ctx.fillStyle='#8f7550';ctx.fillRect(p.x-17*s,p.y-10*s,34*s,7*s);ctx.strokeStyle='#e8c56b';ctx.lineWidth=2*s;ctx.strokeRect(p.x-15*s,p.y-24*s,30*s,19*s);ctx.fillStyle='#dfc07c';for(let j=0;j<(b.delivered||0);j++)ctx.fillRect(p.x-13*s+j*5*s,p.y-15*s,4*s,8*s);ctx.fillStyle='#fff';ctx.font=(10*s)+'px monospace';ctx.textAlign='center';ctx.fillText((b.delivered||0)+'/'+b.required,p.x,p.y-31*s);
if(b.delivered>=b.required){let percent=Math.min(1,(b.buildProgress||0)/5);ctx.fillStyle='#23392a';ctx.fillRect(p.x-19*s,p.y-40*s,38*s,5*s);ctx.fillStyle='#6ee191';ctx.fillRect(p.x-19*s,p.y-40*s,38*s*percent,5*s);
ctx.fillStyle='#f4cf8d';ctx.fillRect(p.x-6*s,p.y-23*s,5*s,8*s);ctx.fillStyle='#eed0a7';ctx.fillRect(p.x-6*s,p.y-28*s,5*s,5*s);}
else if(!roadConnected(b,buildings[0]).length){ctx.fillStyle='#ff6f65';ctx.font=(15*s)+'px sans-serif';ctx.fillText('!',p.x+19*s,p.y-26*s);}
return}let colors={hq:['#c19b68','#953f32'],wood:['#b58d61','#83532c'],saw:['#bca476','#7182a2'],store:['#b5a17d','#aa6e39']},a=colors[b.type],w=(b.type==='hq'?48:36)*s,h=(b.type==='hq'?36:27)*s;ctx.fillStyle='#433323';ctx.fillRect(p.x-w/2+3*s,p.y-21*s,w,22*s);ctx.fillStyle=a[0];ctx.fillRect(p.x-w/2,p.y-34*s,w,25*s);ctx.fillStyle=a[1];ctx.beginPath();ctx.moveTo(p.x-w/2-5*s,p.y-34*s);ctx.lineTo(p.x,p.y-55*s);ctx.lineTo(p.x+w/2+5*s,p.y-34*s);ctx.fill();ctx.fillStyle='#4b3424';ctx.fillRect(p.x-4*s,p.y-22*s,8*s,13*s);if(b.type==='hq'){ctx.fillStyle='#f3c566';ctx.fillRect(p.x+12*s,p.y-58*s,5*s,17*s)}if(b.type==='saw'){ctx.fillStyle='#ded5a0';ctx.beginPath();ctx.arc(p.x+19*s,p.y-11*s,9*s,0,Math.PI*2);ctx.fill()}if(b.type==='wood'){ctx.fillStyle='#be8b43';ctx.fillRect(p.x-22*s,p.y-10*s,12*s,6*s)}}
function occupied(x,y){return buildings.some(b=>b.x===x&&b.y===y)}function cellok(x,y){return valid(x,y)&&map[index(x,y)]===0&&!occupied(x,y)}function route(ax,ay,bx,by,construct=false){let queue=[[ax,ay]],from=new Map(),seen=new Set([key(ax,ay)]),steps=[[1,0],[-1,0],[0,1],[0,-1]],found=false;while(queue.length){let [x,y]=queue.shift();if(x===bx&&y===by){found=true;break}for(let [dx,dy]of steps){let nx=x+dx,ny=y+dy,k=key(nx,ny);if(!valid(nx,ny)||seen.has(k))continue;if(construct?!cellok(nx,ny)&&!(nx===bx&&ny===by):!roads[index(nx,ny)])continue;seen.add(k);from.set(k,[x,y]);queue.push([nx,ny])}}if(!found)return [];let out=[],cur=[bx,by];while(cur[0]!==ax||cur[1]!==ay){out.unshift(cur);cur=from.get(key(...cur));if(!cur)return []}out.unshift([ax,ay]);return out}
function roadConnected(a,b){let starts=adjacentRoad(a.x,a.y),ends=adjacentRoad(b.x,b.y);for(let s of starts)for(let e of ends){let p=route(s[0],s[1],e[0],e[1]);if(p.length)return p}return []}function adjacentRoad(x,y){return [[x+1,y],[x-1,y],[x,y+1],[x,y-1],[x,y]].filter(([a,b])=>valid(a,b)&&roads[index(a,b)])}function nearestRoad(x,y){return adjacentRoad(x,y)[0]||null}function updateMsg(t){message=t;$('msg').textContent=t}function updateStats(){$('logs').textContent=stock.log;$('planks').textContent=stock.plank;$('workers').textContent=carriers.length;$('jobs').textContent=carriers.filter(w=>w.target).length}
let nextWarnAt=0;
function refreshWarnings(){
 const issues=[];
 const sites=buildings.filter(b=>b.status==='construction');
 const disconnected=sites.filter(b=>!roadConnected(b,buildings[0]).length);
 if(disconnected.length)issues.push('🛤 도로 미연결 건설현장 '+disconnected.length+'곳');
 const reserved=carriers.filter(w=>w.item==='plank'&&w.source===buildings[0].id&&w.phase==='pickup').length;
 const outstanding=sites.reduce((v,b)=>v+Math.max(0,(b.required||0)-(b.delivered||0)),0);
 if(outstanding>stock.plank-reserved+carriers.filter(w=>w.item==='plank'&&w.phase==='delivery'&&sites.some(b=>b.id===w.target)).length)
 issues.push('🧱 건설 자재 부족 · 제재소 가동 확인');
 const waiting=buildings.filter(b=>b.type==='wood'&&b.status!=='construction'&&(b.amount||0)>0&&!buildings.some(s=>s.type==='saw'&&s.status!=='construction'&&roadConnected(b,s).length));
 if(waiting.length)issues.push('📦 원목 운송 대기 · 제재소 도로 확인');
 const el=$('warnings');el.style.display=issues.length?'block':'none';el.textContent=issues.slice(0,3).join(' / ');

function act(x,y){if(!valid(x,y))return;if(tool==='info'){let b=buildings.find(b=>b.x===x&&b.y===y);if(b&&b.status==='construction'){updateMsg('🏗 판자 '+b.delivered+'/'+b.required+(b.delivered>=b.required?' · 시공 중':' · 자재 대기'));return}updateMsg(b?`${{hq:'본부',wood:'나무꾼',saw:'제재소',store:'창고'}[b.type]} · 생산 진행 ${Math.floor((b.prog||0)*100)}%`:`타일 (${x},${y}) · ${roads[index(x,y)]?'도로':'빈 공간'}`);return}if(tool==='road'){if(!cellok(x,y)&&!roads[index(x,y)]){updateMsg('도로를 놓을 수 없는 위치입니다.');return}let anchors=[];for(let yy=Math.max(0,y-12);yy<Math.min(N,y+13);yy++)for(let xx=Math.max(0,x-12);xx<Math.min(N,x+13);xx++)if(roads[index(xx,yy)])anchors.push([xx,yy]);anchors.sort((a,b)=>Math.abs(a[0]-x)+Math.abs(a[1]-y)-Math.abs(b[0]-x)-Math.abs(b[1]-y));if(!anchors.length){roads[index(x,y)]=true;updateMsg('도로 설치 완료');return}let p=route(anchors[0][0],anchors[0][1],x,y,true);if(!p.length){updateMsg('도로를 연결할 수 없습니다.');return}for(let [a,b]of p)roads[index(a,b)]=true;updateMsg(`도로 ${p.length}타일 연결 완료`);return}let price={wood:2,saw:3,store:4}[tool];if(!price)return;if(!cellok(x,y)){updateMsg('이 위치에는 건설할 수 없습니다.');return}buildings.push({id:Date.now()+Math.random(),type:tool,x,y,prog:0,amount:0,required:price,delivered:0,status:'construction',buildProgress:0});updateMsg('🏗 건설현장 설치 · 판자 '+price+'개를 운송하려면 도로로 연결하세요.');updateStats()}
function nearestTree(b){let best=null,dist=1e9;for(let y=Math.max(0,b.y-5);y<=Math.min(N-1,b.y+5);y++)for(let x=Math.max(0,b.x-5);x<=Math.min(N-1,b.x+5);x++)if(trees[index(x,y)]>0){let d=Math.abs(b.x-x)+Math.abs(b.y-y);if(d<dist){dist=d;best=[x,y]}}return best}
function inventoryLogTotal(){return buildings.filter(b=>b.type==='wood'||b.type==='saw').reduce((n,b)=>n+(b.amount||0),0)+carriers.filter(w=>w.cargo==='log').length}
function getBuilding(id){return buildings.find(b=>b.id===id)}
function assignTransport(source,dest,item){
  const idle=carriers.find(w=>!w.target&&!w.cargo&&(!w.path||!w.path.length));
  if(!idle)return false;
  const destRoad=roadConnected(source,dest);if(!destRoad.length)return false;
  const near=nearestRoad(Math.round(idle.x),Math.round(idle.y));
  if(!near)return false;
  const pickup=destRoad[0],walk=route(near[0],near[1],pickup[0],pickup[1]);
  if(!walk.length)return false;
  idle.path=walk.map(([x,y])=>({x,y}));
  idle.step=0;idle.target=dest.id;idle.source=source.id;idle.item=item;
  idle.phase='pickup';idle.delivery=destRoad.map(([x,y])=>({x,y}));
  return true;
}
function simulate(dt){
  tick+=dt;
  for(const b of buildings){
    if(b.status==='construction'){if(b.delivered>=b.required){b.buildProgress=(b.buildProgress||0)+dt;if(b.buildProgress>=5){b.status='active';b.prog=0;updateMsg('🎉 건물이 완공되었습니다!')}}continue}
    if(b.type==='wood'){
      const tree=nearestTree(b);
      if(tree&&roadConnected(b,buildings[0]).length){
        b.prog=(b.prog||0)+dt/5;
        if(b.prog>=1){b.prog-=1;trees[index(...tree)]--;b.amount=(b.amount||0)+1;updateMsg('🌲 원목 생산 완료 · 운반부 배정 대기')}
      }
    }
    if(b.type==='saw'&&(b.amount||0)>=2){
      b.prog=(b.prog||0)+dt/8;
      if(b.prog>=1){b.prog-=1;b.amount-=2;b.planks=(b.planks||0)+1;updateMsg('🪚 판자 생산 완료 · 창고 운송 대기')}
    }
  }
  for(const site of buildings.filter(v=>v.status==='construction'&&v.delivered<v.required)){
    const reserved=carriers.filter(w=>w.target===site.id&&w.item==='plank').length;
    const available=stock.plank-carriers.filter(w=>w.phase==='pickup'&&w.item==='plank'&&w.source===buildings[0].id).length;
    if(site.required-site.delivered>reserved&&available>0)assignTransport(buildings[0],site,'plank');
  }
  for(const b of buildings.filter(v=>v.status!=='construction'&&v.type==='wood'&&(v.amount||0)>0)){
    const dest=buildings.find(v=>v.status!=='construction'&&v.type==='saw'&&roadConnected(b,v).length);
    if(!dest)continue;
    const reserved=carriers.filter(w=>w.source===b.id&&w.item==='log'&&w.phase==='pickup').length;
    if(b.amount>reserved)assignTransport(b,dest,'log');
  }
  for(const b of buildings.filter(v=>v.status!=='construction'&&v.type==='saw'&&(v.planks||0)>0)){
    const dest=buildings.find(v=>(v.type==='store'||v.type==='hq')&&roadConnected(b,v).length);
    if(!dest)continue;
    const reserved=carriers.filter(w=>w.source===b.id&&w.item==='plank'&&w.phase==='pickup').length;
    if(b.planks>reserved)assignTransport(b,dest,'plank');
  }
  for(const w of carriers){
    if(!w.target)continue;
    const source=getBuilding(w.source),dest=getBuilding(w.target);
    if(!source||!dest){w.target=null;w.path=[];w.phase='blocked';continue}
    if(!w.path||!w.path.length){w.phase='blocked';continue}
    w.step=(w.step||0)+dt*2;
    if(w.step>=w.path.length-1){
      const last=w.path[w.path.length-1];w.x=last.x;w.y=last.y;
      if(w.phase==='pickup'){
        const field=w.item==='log'?'amount':'planks';
        const fromHq=source.type==='hq'&&w.item==='plank';
        if((fromHq?stock.plank:(source[field]||0))<=0){w.path=[];w.target=null;w.phase='idle';continue}
        if(fromHq)stock.plank--;else source[field]--;w.cargo=w.item;
        const available=roadConnected(source,dest);
        if(!available.length){if(fromHq)stock.plank++;else source[field]++;w.cargo=null;w.path=[];w.target=null;w.phase='blocked';continue}
        w.path=available.map(([x,y])=>({x,y}));w.step=0;w.phase='delivery';
      }else if(w.phase==='delivery'){
        if(w.cargo==='log')dest.amount=(dest.amount||0)+1;
        if(w.cargo==='plank'){if(dest.status==='construction'){dest.delivered++;updateMsg('🧱 건설현장 판자 '+dest.delivered+'/'+dest.required+' 배송 완료')}else{stock.plank++;updateMsg('📦 판자 1개가 창고에 도착했습니다.')}}
        w.cargo=null;w.item=null;w.source=null;w.target=null;w.path=[];w.step=0;w.phase='idle';w.delivery=null;
      }
    }else{
      const i=Math.floor(w.step),f=w.step-i;
      w.x=w.path[i].x+(w.path[i+1].x-w.path[i].x)*f;
      w.y=w.path[i].y+(w.path[i+1].y-w.path[i].y)*f;
    }
  }
  stock.log=inventoryLogTotal();
  updateStats();if(tick>=nextWarnAt){refreshWarnings();nextWarnAt=tick+2}
}
let lastTime=performance.now();function frame(t){let dt=Math.min((t-lastTime)/1000,.2);lastTime=t;simulate(dt);setTimeout(()=>requestAnimationFrame(frame),100)}function save(){try{localStorage.setItem('pixelkingdom-save-v1',JSON.stringify({map,trees,roads,buildings,carriers,stock,tick,scale,ox,oy}));updateMsg('💾 게임이 브라우저에 저장되었습니다.')}catch(e){updateMsg('저장 실패: 브라우저 저장 공간을 확인하세요.')}}function load(){try{let s=localStorage.getItem('pixelkingdom-save-v1');if(!s){updateMsg('저장된 게임이 없습니다.');return}let v=JSON.parse(s);if(v.map.length!==N*N||v.roads.length!==N*N)throw Error('invalid');Object.assign(stock,v.stock);map=v.map;trees=v.trees;roads=v.roads;buildings=v.buildings;carriers=v.carriers;tick=v.tick||0;scale=v.scale||1;ox=v.ox;oy=v.oy;nextWarnAt=0;updateStats();refreshWarnings();updateMsg('↩ 게임을 불러왔습니다.')}catch(e){updateMsg('저장 파일을 불러올 수 없습니다.')}}function zoom(v){scale=Math.max(.45,Math.min(2.5,scale*v))}
const pointers=new Map();c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};moved=false;if(pointers.size===2)pinch=null});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let pts=[...pointers.values()],dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinch)zoom(dist/pinch);pinch=dist;moved=true;return}if(last){let dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>1){ox+=dx;oy+=dy;if(Math.abs(dx)+Math.abs(dy)>3)moved=true}last={x:e.clientX,y:e.clientY}}});c.addEventListener('pointerup',e=>{let prev=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(!moved&&prev&&tool!=='pan'){let p=tile(e.clientX,e.clientY);act(p.x,p.y)}if(!pointers.size){last=null;pinch=null}});c.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);last=null;pinch=null});document.querySelectorAll('#tools button').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.t;document.querySelectorAll('#tools button').forEach(z=>z.classList.toggle('selected',z===b));updateMsg(tool==='pan'?'맵을 드래그하여 이동하세요.':tool==='road'?'타일을 터치하면 가까운 도로에서 자동 연결됩니다.':'맵에서 설치할 위치를 터치하세요.')}));$('save').onclick=save;$('load').onclick=load;$('reset').onclick=()=>{if(confirm('새 게임을 시작할까요? 현재 진행 상황은 사라집니다.'))fresh()};$('zoomin').onclick=()=>zoom(1.2);$('zoomout').onclick=()=>zoom(1/1.2);window.addEventListener('resize',resize);resize();fresh();requestAnimationFrame(draw);requestAnimationFrame(frame);setInterval(save,60000)})();
</script></body></html>
